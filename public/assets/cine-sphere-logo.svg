<svg width="180" height="50" viewBox="0 0 180 50" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7B2CBF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9D4EDD;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Cine -->
  <text x="0" y="32" font-family="Space Grotesk, sans-serif" font-size="28" font-weight="700" fill="url(#logoGradient)" letter-spacing="-0.5">Cine</text>
  
  <!-- Sphere -->
  <text x="65" y="32" font-family="Space Grotesk, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" letter-spacing="-0.5">Sphere</text>
  
  <!-- Decorative circle -->
  <circle cx="60" cy="25" r="3" fill="url(#logoGradient)" opacity="0.8"/>
</svg>